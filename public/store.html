<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가맹점 상세</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- 패널 1: 가맹점 정보 -->
  <div id="view-store">
    <div id="store-name">불러오는 중...</div>
    <div id="store-info"></div>
    <button id="ate-btn">먹었어요</button>
  </div>

  <!-- 패널 2: 메뉴 목록 -->
  <div id="view-menus" style="display:none">
    <button id="back-to-store-btn">이전</button>
    <div id="menu-list"></div>
    <div id="meal-record-msg"></div>
    <button id="add-menu-btn">메뉴 추가</button>
  </div>

  <!-- 패널 3: 메뉴 추가 -->
  <div id="view-add-menu" style="display:none">
    <button id="back-to-menus-btn">이전</button>
    <div>
      <label for="menu-name-input">메뉴 이름</label>
      <input id="menu-name-input" type="text" placeholder="메뉴 이름 직접 입력" />
    </div>
    <div>
      <input id="search-input" type="text" placeholder="영양성분 검색 (예: 김밥)" />
      <button id="search-btn">검색</button>
    </div>
    <div id="search-results"></div>
  </div>

  <nav class="bottom-nav">
    <a href="/map">지도</a>
    <a href="/diet">식단</a>
  </nav>

  <script src="/js/store.js"></script>
</body>
</html>
