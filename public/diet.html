<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>식단 분석</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <h1 class="top-banner">식단 분석</h1>

  <div id="mode-toggle">
    <button id="daily-btn">일간</button>
    <button id="weekly-btn">주간</button>
  </div>

  <div id="week-nav">
    <button id="prev-week-btn">이전</button>
    <span id="week-label"></span>
    <button id="next-week-btn">다음</button>
  </div>

  <div id="warning-container"></div>

  <div id="chart-container"></div>

  <div id="timeline-container"></div>

  <nav class="bottom-nav fade-in-f">
    <button class="nav-btn" onclick="location.href='/map'">지도</button>
    <button class="nav-btn active" onclick="location.href='/diet'">식단</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="/js/diet.js"></script>
</body>
</html>
