<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식카드 가맹점 지도</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="top-banner">내 주변 가맹점</div>

    <div id="map"></div>

    <button id="myLocationBtn" class="my-location-btn" title="현재 위치로 이동">🎯</button>

    <div class="store-list-container" id="storeList">
        <div class="store-item">
            <span class="store-name"> 가맹점 목록 로딩 중...</span>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="location.href='/map'">지도</button>
        <button class="nav-btn" onclick="location.href='/diet'">식단</button>
    </div>

    <script src="/config_client.js"></script>
    <script>
      (function () {
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + CONFIG_CLIENT.KAKAO_API_KEY + '&autoload=false';
        s.onload = function () {
          kakao.maps.load(function () {
            var mapScript = document.createElement('script');
            mapScript.src = '/js/map.js';
            document.body.appendChild(mapScript);
          });
        };
        document.head.appendChild(s);
      })();
    </script>
</body>
</html>
