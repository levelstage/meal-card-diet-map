<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식카드 가맹점 지도</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="top-banner">내 주변 가맹점</div>

    <div id="map"></div>

    <button id="myLocationBtn" class="my-location-btn" title="현재 위치로 이동">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt" viewBox="0 0 16 16">
  <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/>
  <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
</svg>
    </button>

    <div class="store-list-container fade-in" id="storeList">
        <div class="store-item">
            <span class="store-name placeholder pulsate-fwd"> 가맹점 목록 로딩 중...</span>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active fade-in" onclick="location.href='/map'">지도</button>
        <button class="nav-btn" onclick="location.href='/diet'">식단</button>
    </div>

    <script src="/config_client.js"></script>
    <script>
      (function () {
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + CONFIG_CLIENT.KAKAO_API_KEY + '&autoload=false';
        s.onload = function () {
          kakao.maps.load(function () {
            var mapScript = document.createElement('script');
            mapScript.src = '/js/map.js';
            document.body.appendChild(mapScript);
          });
        };
        document.head.appendChild(s);
      })();
    </script>
</body>
</html>
